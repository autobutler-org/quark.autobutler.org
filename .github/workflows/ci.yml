name: Continuous Integration

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: each doc's "Updated" date is its last git commit.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache npm
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Generate static site
        run: npm run generate

      - name: Check generated site
        run: make check/generated

      # Internal links must resolve; outbound ones too, except rate limits.
      # Same-site URLs are checked against this build. A new page's canonical
      # link and its llms.txt entry are not on the live site until this merges.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/.output/public
            --remap "https://quark.autobutler.org file://${{ github.workspace }}/.output/public"
            --accept 200..=299,403,429
            --max-retries 3
            '.output/public/**/*.html'
            .output/public/llms.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
