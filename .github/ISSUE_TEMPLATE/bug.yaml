name: Bug Report
description: Something on the website is broken or wrong.
title: "[Bug] "
labels: ["bug"]
projects: ["autobutler-org/2"]
type: Bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        This tracker is for <https://quark.autobutler.org>. If Quark itself is
        misbehaving, [file it in the product repository](https://github.com/autobutler-org/quark/issues/new/choose)
        instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What part of the site is affected?
      multiple: true
      options:
        - N/A
        - Copy / wording
        - Layout / styling
        - Broken link
        - Accessibility
        - Performance
        - Deployment / build
      default: 0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also, what did you expect to happen?
      placeholder: What is going on? 🔫
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other
  - type: input
    id: viewport
    attributes:
      label: Screen or window width
      description: Layout bugs usually depend on it. Approximate is fine.
      placeholder: "e.g. 375px (iPhone), 1440px (laptop)"
  - type: input
    id: url
    attributes:
      label: URL of problem
      description: Provide a URL (local or remote) that demonstrates the problem
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Browser console output, build errors, anything relevant. This will be automatically formatted into code, so no need for backticks.
      render: shell
