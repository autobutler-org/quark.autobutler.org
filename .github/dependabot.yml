version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps/github-actions): "
    labels:
      - dependabot
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps/npm): "
    labels:
      - dependabot
    ignore:
      # TypeScript 7 is the Go-ported compiler with a restructured package
      # (no more `typescript/lib/tsc` export). vue-tsc and typescript-eslint
      # don't support it yet -- revisit once they do.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
